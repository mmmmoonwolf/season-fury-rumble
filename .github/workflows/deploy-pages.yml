name: Deploy game to GitHub Pages

# Publishes the game/ folder as a static site on every push to master.
# The game is live at https://<owner>.github.io/<repo>/ — open that URL in any
# browser, no local server / Node / Python needed (so the game is playable from a
# public PC like an internet cafe, where you can't run `npx serve`).
#
# Must stay on master: GitHub auto-creates the `github-pages` environment with a
# deployment branch policy allowing the default branch only. Deploying from a
# feature branch fails in ~2s with no steps and no logs (the job is rejected
# before a runner is ever assigned), which looks exactly like a broken workflow
# but isn't. Feature work therefore has to land on master to go live.
#
# One-time manual step, already done (the default GITHUB_TOKEN can't grant itself
# repo-admin rights, so this genuinely can't be automated from the workflow):
#   repo Settings -> Pages -> "Build and deployment" -> Source -> "GitHub Actions"
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
