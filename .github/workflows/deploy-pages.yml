name: Deploy game to GitHub Pages

# Publishes the game/ folder as a static site on every push to master.
# The game is live at https://<owner>.github.io/<repo>/ — open that URL in any
# browser, no local server / Node / Python needed (so the game is playable from a
# public PC like an internet cafe, where you can't run `npx serve`).
#
# Must stay on master: GitHub auto-creates the `github-pages` environment with a
# deployment branch policy allowing the default branch only. Deploying from a
# feature branch fails in ~2s with no steps and no logs (the job is rejected
# before a runner is ever assigned), which looks exactly like a broken workflow
# but isn't. Feature work therefore has to land on master to go live.
#
# One-time manual step, already done (the default GITHUB_TOKEN can't grant itself
# repo-admin rights, so this genuinely can't be automated from the workflow):
#   repo Settings -> Pages -> "Build and deployment" -> Source -> "GitHub Actions"
#
# เทสต์เป็นด่านก่อน deploy (job `test` ด้านล่าง) เทสต์แดง = ไม่ขึ้นเว็บ
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── ด่านก่อนขึ้นเว็บ ──
  # เทสต์ต้องผ่านก่อนถึงจะ deploy ไม่ใช่ deploy ไปแล้วค่อยรู้ว่าพัง
  # เกมนี้ขึ้นเว็บทุกครั้งที่ push master และมีคนกดเล่นจากลิงก์นั้นจริง
  # ปล่อยของพังขึ้นไปแล้วค่อยแก้ = คนที่เปิดในช่วงนั้นเห็นเกมเสีย
  #
  # เขียนเป็นอีก job ในไฟล์เดียวกัน ไม่ใช่รอผลจาก tests.yml
  # เพราะการรอผลข้ามไฟล์บน GitHub Actions ต้องพึ่ง workflow_run ซึ่งรันหลังจบ
  # แล้วกลายเป็น "deploy หลังเทสต์" คนละเรื่องกับ "deploy เฉพาะเมื่อเทสต์ผ่าน"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # เทสต์ลำดับท่า (sheet_order) เรียกเครื่องมือฝั่ง Python จริง ไม่ใช่เลียนแบบ
      # เพราะสิ่งที่มันตรวจคือ "ลำดับที่ sheet_poses.py คืนมา" ซึ่งเลียนแบบแล้วไม่มีความหมาย
      # runner ของ GitHub มี python3 แต่ไม่มี numpy/pillow ต้องลงเอง (~15 วินาที)
      # ไม่ลงแล้วเทสต์ข้อนั้น CRASH ซึ่ง run_all.sh นับเป็นไม่ผ่าน — ตามที่ควรเป็น
      # ไม่ได้ทำให้มันข้ามไปเงียบ ๆ เพราะ "ข้ามแบบมองไม่เห็น" คือวิธีที่ความครอบคลุมหายไปทีละข้อ
      - name: ลง Python deps ที่เทสต์ฝั่งเครื่องมือใช้
        run: python3 -m pip install --quiet numpy pillow
      - name: รันเทสต์ทั้งชุด
        working-directory: game
        run: bash tools/tests/run_all.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
