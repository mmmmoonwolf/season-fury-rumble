name: Cashline Arena tests

# เทสต์ของเกม cashline-arena (โฟลเดอร์แยก คนละเกมกับ game/)
# รันเฉพาะตอนไฟล์ในโฟลเดอร์นั้นเปลี่ยน: ซิมบอท + e2e ผ่าน mock + e2e ผ่าน WebSocket relay จริง
on:
  push:
    paths:
      - 'cashline-arena/**'
      - '.github/workflows/cashline-arena.yml'
  pull_request:
    paths:
      - 'cashline-arena/**'
      - '.github/workflows/cashline-arena.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cashline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashline-arena
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # ต้องเป็น headless shell ที่ playwright ลงให้ ไม่ใช่ Chrome เต็มตัว (ดู CLAUDE.md หัวข้อ Commands)
      - run: npx playwright install --with-deps chromium
      - run: npm test
